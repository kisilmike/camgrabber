<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__FOLDER__ - Camgrabber</title>
<style>
:root{--bg:#fff;--fg:#1d2330;--mut:#667;--line:#dde1e8;--tick:#5b6577;--grid:#aab1bf;--accent:#d93d3d;--panel:#f3f4f7}
@media(prefers-color-scheme:dark){:root{--bg:#101318;--fg:#e6e9ef;--mut:#99a;--line:#2b303b;--tick:#8d99b0;--grid:#4a5263;--accent:#ff6b6b;--panel:#1a1e26}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header a{color:var(--mut);text-decoration:none}
header b{font-size:16px}
header input{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
#info{margin-left:auto;font-variant-numeric:tabular-nums}
#hd,#pre{color:var(--mut);font-size:12px}header label{font-size:12px;color:var(--mut)}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
#main{width:100%;height:100%;object-fit:contain}
#empty{position:absolute;color:#aaa}
#busy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;background:rgba(0,0,0,.35);pointer-events:none;font-size:15px;text-shadow:0 1px 3px #000}
#busy[hidden]{display:none}
#busy i{width:44px;height:44px;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
footer{display:flex;align-items:stretch;gap:8px;padding:8px 12px 12px;border-top:1px solid var(--line);background:var(--panel)}
footer button{width:44px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;font-size:18px;cursor:pointer}
footer button:disabled{opacity:.35;cursor:default}
#tl{flex:1;min-width:0;height:72px;touch-action:none;cursor:crosshair;background:var(--bg);border:1px solid var(--line);border-radius:8px}
</style></head><body>
<header><a href="/">&larr; все камеры</a><b>__FOLDER__</b><input type="date" id="date"><label><input type="checkbox" id="preon" checked> кэш дня</label><span id="pre"></span><span id="hd"></span><span id="info"></span></header>
<main><img id="main" alt=""><div id="busy" hidden><i></i><span id="busytxt">загрузка таймлинии</span></div><div id="empty" hidden>В этот день снимков нет</div></main>
<footer><button id="prev" title="Предыдущий день (PageUp)">&#9664;</button><canvas id="tl"></canvas><button id="next" title="Следующий день (PageDown)">&#9654;</button></footer>
<script>
(() => {
const FOLDER = "__FOLDER__";
const $ = s => document.querySelector(s);
const main = $("#main"), cv = $("#tl"), info = $("#info"), dateIn = $("#date"), hd = $("#hd"), empty = $("#empty");
const prevB = $("#prev"), nextB = $("#next"), pre = $("#pre"), preOn = $("#preon");
const SCRUB = 800;
const busy = $("#busy");
const busytxt = $("#busytxt");
const setBusy = (on, txt) => { busy.hidden = !on; busytxt.textContent = txt || "загрузка таймлинии"; };
let preToken = 0, bundle = null, lastBlob = null, waiting = null, dl = null;
let days = [], date = null, times = [], secs = [], cur = -1;
let want = -1, lastReq = -1, inflight = 0, reqSeq = 0, shownSeq = 0, dayGen = 0, pumpRaf = 0, hdTimer = 0, urlTimer = 0;
let layer = null, layerKey = "", accColor = "#d93d3d";

const toSec = t => { const p = t.split("-").map(Number); return p[0] * 3600 + p[1] * 60 + p[2]; };
const api = async u => { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); };
const nearest = s => {
  if (!secs.length) return -1;
  let lo = 0, hi = secs.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (secs[m] < s) lo = m + 1; else hi = m; }
  return lo > 0 && s - secs[lo - 1] < secs[lo] - s ? lo - 1 : lo;
};

async function loadDay(d, targetSec) {
  const r = await api(`/api/day/${FOLDER}/${d}`);
  date = d; times = r.files; secs = times.map(toSec); dateIn.value = d;
  const k = days.indexOf(d);
  prevB.disabled = k <= 0; nextB.disabled = k < 0 || k >= days.length - 1;
  empty.hidden = times.length > 0;
  cur = -1; want = -1; lastReq = -1; dayGen++; draw();
  if (times.length) select(nearest(targetSec === undefined ? 86400 : targetSec));
  else { main.removeAttribute("src"); info.textContent = ""; }
  startPreload();
}

function cancelWait() {
  if (dl) { dl.abort(); dl = null; }
  if (waiting) { navigator.sendBeacon(`/api/bundle-cancel/${FOLDER}/${waiting}`); waiting = null; }
}

function startPreload() {
  cancelWait();
  const my = ++preToken;
  bundle = null;
  setBusy(false);
  pre.textContent = "";
  if (!preOn.checked || !times.length) return;
  run(my);
}

async function run(my) {
  let st = { state: "live" };
  const d = date;
  try { st = await api(`/api/bundle/${FOLDER}/${d}`); } catch (e) {}
  if (my !== preToken) {
    if (st.state === "building") navigator.sendBeacon(`/api/bundle-cancel/${FOLDER}/${d}`);
    return;
  }
  if (st.state === "ready") { waiting = null; return loadBundle(my, st); }
  if (st.state === "building") {
    pre.textContent = "";
    setBusy(true, st.queued ? "загрузка таймлинии: в очереди на сервере"
                            : `загрузка таймлинии: готовим на сервере ${Math.round(100 * st.done / Math.max(1, st.total))}%`);
    waiting = date;
    setTimeout(() => { if (my === preToken) run(my); }, 2000);
    return;
  }
  waiting = null;
  preloadSingles(my);
}

async function loadBundle(my, st) {
  setBusy(true);
  try {
    dl = new AbortController();
    const r = await fetch(`/bundle/${FOLDER}/${date}?v=${st.v}`, { signal: dl.signal });
    const reader = r.body.getReader();
    const chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      if (my !== preToken) { reader.cancel(); return; }
      chunks.push(value); got += value.length;
      pre.textContent = `${Math.round(got / st.size * 100)}%`;
      setBusy(true, `загрузка таймлинии: скачивание ${Math.round(got / st.size * 100)}%`);
    }
    const buf = new Uint8Array(got); let o = 0;
    for (const ch of chunks) { buf.set(ch, o); o += ch.length; }
    const hl = new DataView(buf.buffer).getUint32(0);
    const h = JSON.parse(new TextDecoder().decode(buf.subarray(4, 4 + hl)));
    const map = new Map(h.items.map(it => [it[0], [4 + hl + it[1], it[2]]]));
    if (my !== preToken) return;
    bundle = { buf, map };
    pre.textContent = "в кэше";
    setBusy(false);
    if (cur >= 0 && hd.textContent !== "HD") { want = cur; lastReq = -1; pump(); }
  } catch (e) { if (my !== preToken) return; pre.textContent = ""; setBusy(false); preloadSingles(my); }
}

function preloadSingles(my) {
  const d = date, list = times.slice(), at = cur;
  const order = list.map((_, i) => i).sort((a, b) => Math.abs(a - at) - Math.abs(b - at));
  let k = 0, done = 0;
  const worker = async () => {
    while (k < order.length && my === preToken) {
      if (document.hidden) { await new Promise(r => setTimeout(r, 1000)); continue; }
      const i = order[k++];
      try { const r = await fetch(`/img/${FOLDER}/${d}/${list[i]}?w=${SCRUB}`); await r.arrayBuffer(); } catch (e) {}
      if (my === preToken) { done++; pre.textContent = done < list.length ? `${done}/${list.length}` : "в кэше"; }
    }
  };
  worker(); worker(); worker();
}
try { preOn.checked = localStorage.getItem("preload") !== "0"; } catch (e) {}
preOn.onchange = () => { try { localStorage.setItem("preload", preOn.checked ? "1" : "0"); } catch (e) {} startPreload(); };

function draw() {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W) return;
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const key = `${W}x${H}x${dpr}|${date}|${secs.length}|${dark}`;
  if (key !== layerKey) {
    layerKey = key;
    layer = document.createElement("canvas"); layer.width = W * dpr; layer.height = H * dpr;
    cv.width = W * dpr; cv.height = H * dpr;
    const g = layer.getContext("2d"); g.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    const tick = css.getPropertyValue("--tick"), grid = css.getPropertyValue("--grid"), fg = css.getPropertyValue("--mut");
    accColor = css.getPropertyValue("--accent");
    g.font = "11px system-ui,sans-serif"; g.textBaseline = "bottom";
    for (let h = 0; h <= 24; h++) {
      const x = Math.round(h / 24 * (W - 1));
      g.fillStyle = grid; g.fillRect(x, H - 16, 1, h % 3 ? 4 : 8);
      if (h % 3 === 0) { g.fillStyle = fg; g.textAlign = h === 0 ? "left" : h === 24 ? "right" : "center"; g.fillText(String(h).padStart(2, "0"), x, H - 1); }
    }
    g.fillStyle = tick;
    for (const s of secs) g.fillRect(Math.floor(s / 86400 * (W - 1)), 8, 1, H - 28);
  }
  const g = cv.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height); g.drawImage(layer, 0, 0);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (cur >= 0) { const x = Math.floor(secs[cur] / 86400 * (W - 1)); g.fillStyle = accColor; g.fillRect(x - 1, 2, 3, H - 20); }
}

function syncUrl() {
  if (!date || cur < 0) return;
  try { history.replaceState(null, "", `?d=${date}&t=${times[cur]}`); } catch (e) {}
}

function fmtDate(d) { const p = d.split("-"); return `${p[2]}.${p[1]}.${p[0]}`; }

function select(i) {
  if (i < 0 || i === cur) return;
  cur = i; draw();
  info.textContent = `${fmtDate(date)} ${times[i].replace(/-/g, ":")}  (${i + 1}/${times.length})`;
  want = i; schedulePump();
  clearTimeout(hdTimer); clearTimeout(urlTimer);
  hdTimer = setTimeout(() => { if (cur === i) { show(i, 0); prefetch(i); } }, 350);
  urlTimer = setTimeout(syncUrl, 300);
}

// Конвейер кадров: всегда грузим самый свежий нужный кадр; готовый показываем,
// если он новее уже показанного, поэтому картинка идёт за курсором без зависаний.
const maxInflight = () => bundle ? 2 : 4;
function schedulePump() { if (!pumpRaf) pumpRaf = requestAnimationFrame(() => { pumpRaf = 0; pump(); }); }
function pump() {
  if (want < 0 || want === lastReq || inflight >= maxInflight()) return;
  lastReq = want;
  show(want, SCRUB);
}

function show(i, w) {
  const gen = dayGen, seq = ++reqSeq, t = times[i];
  const e = w === SCRUB && bundle && bundle.map.get(t);
  const url = e ? URL.createObjectURL(new Blob([new Uint8Array(bundle.buf.buffer, e[0], e[1])], { type: "image/jpeg" }))
                : `/img/${FOLDER}/${date}/${t}?w=${w}`;
  const im = new Image();
  inflight++;
  const finish = ok => {
    inflight--;
    if (ok && gen === dayGen && seq > shownSeq) {
      shownSeq = seq;
      main.src = url;
      if (lastBlob) URL.revokeObjectURL(lastBlob);
      lastBlob = e ? url : null;
      hd.textContent = w === 0 ? "HD" : "";
    } else if (e) URL.revokeObjectURL(url);
    pump();
  };
  im.src = url;
  (im.decode ? im.decode() : new Promise((res, rej) => { im.onload = res; im.onerror = rej; })).then(() => finish(true), () => finish(false));
}

function prefetch(i) {
  for (const j of [i - 1, i + 1]) if (j >= 0 && j < times.length && !(bundle && bundle.map.has(times[j]))) new Image().src = `/img/${FOLDER}/${date}/${times[j]}?w=${SCRUB}`;
}

function pointerIdx(e) {
  const r = cv.getBoundingClientRect();
  return nearest(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 86400);
}
cv.addEventListener("pointermove", e => { select(pointerIdx(e)); });
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); select(pointerIdx(e)); });

async function gotoDay(delta) {
  const k = days.indexOf(date) + delta;
  if (k < 0 || k >= days.length) return;
  await loadDay(days[k], cur >= 0 ? secs[cur] : undefined);
}
prevB.onclick = () => gotoDay(-1);
nextB.onclick = () => gotoDay(1);
dateIn.onchange = () => {
  const d = dateIn.value;
  if (!d) return;
  const pick = days.includes(d) ? d : days.filter(x => x <= d).pop() || days[0];
  loadDay(pick, cur >= 0 ? secs[cur] : undefined);
};
document.addEventListener("keydown", e => {
  if (e.target === dateIn) return;
  if (e.key === "ArrowLeft") select(Math.max(0, cur - 1));
  else if (e.key === "ArrowRight") select(Math.min(times.length - 1, cur + 1));
  else if (e.key === "PageUp") gotoDay(-1);
  else if (e.key === "PageDown") gotoDay(1);
  else return;
  e.preventDefault();
});
window.addEventListener("resize", draw);
window.addEventListener("pagehide", cancelWait);

// если смотрим последний день - подтягиваем новые снимки раз в минуту
setInterval(async () => {
  try {
    if (date !== days[days.length - 1]) return;
    const r = await api(`/api/day/${FOLDER}/${date}`);
    if (r.files.length !== times.length) { times = r.files; secs = times.map(toSec); draw(); }
  } catch (e) {}
}, 60000);

(async () => {
  try {
    days = (await api(`/api/days/${FOLDER}`)).days;
    dateIn.min = days[0]; dateIn.max = days[days.length - 1];
    const q = new URLSearchParams(location.search), want = q.get("d"), t = q.get("t");
    await loadDay(days.includes(want) ? want : days[days.length - 1], /^\d{2}-\d{2}-\d{2}$/.test(t || "") && days.includes(want) ? toSec(t) : undefined);
  } catch (e) { empty.hidden = false; empty.textContent = "Нет данных по этой камере"; }
})();
})();
</script></body></html>
